<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태양계 관측소 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#0b1020;--card:#151c33;--line:#2a3558;--ink:#f3f5ff;--muted:#a9b3d6;--gold:#ffcf5a;--green:#3dff8f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1d2a55 0%,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:28px 16px 40px}
header{text-align:center;margin-bottom:26px}
.kicker{color:var(--gold);font-weight:700;letter-spacing:.08em;margin:0 0 6px;font-size:clamp(14px,1.4vw,18px)}
h1{margin:0;font-size:clamp(30px,4vw,54px);font-weight:900}
.lead{color:var(--muted);margin:10px 0 0;font-size:clamp(15px,1.5vw,20px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;border-top:6px solid var(--c)}
.no{display:inline-block;background:var(--c);color:#0b1020;font-weight:900;border-radius:999px;padding:4px 14px;font-size:clamp(14px,1.2vw,17px)}
.emo{font-size:clamp(40px,4vw,58px);line-height:1;margin:14px 0 6px}
.card h2{margin:0;font-size:clamp(22px,2vw,30px);font-weight:900}
.topic{color:var(--muted);margin:6px 0 14px;font-size:clamp(14px,1.2vw,17px);min-height:2.6em}
.qr{background:#fff;border-radius:16px;padding:12px;width:100%;max-width:260px;aspect-ratio:1;border:0;cursor:zoom-in;display:block}
.qr svg{width:100%;height:100%;display:block}
.ws{margin:14px 0 12px;background:var(--green);color:#03230f;font-weight:900;border-radius:999px;padding:5px 16px;font-size:clamp(14px,1.2vw,17px)}
.go{color:var(--ink);text-decoration:none;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:10px 16px;width:100%;max-width:260px;display:block;background:#1d2747}
.go:hover{border-color:var(--c)}
.url{color:var(--muted);font-size:12px;margin-top:8px;word-break:break-all}
.tip{text-align:center;color:var(--muted);margin-top:24px;font-size:clamp(13px,1.2vw,16px)}
#big{position:fixed;inset:0;background:rgba(5,8,18,.94);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;cursor:zoom-out;padding:16px}
#big.on{display:flex}
#big .box{background:#fff;border-radius:24px;padding:24px;width:min(78vh,90vw);aspect-ratio:1}
#big .box svg{width:100%;height:100%;display:block}
#big h3{margin:0 0 16px;font-size:clamp(26px,3.6vw,48px);font-weight:900;text-align:center}
#big p{color:var(--muted);margin:14px 0 0;font-size:18px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000}
  .wrap{padding:0}
  .card{background:#fff;border-color:#bbb;break-inside:avoid}
  .lead,.topic,.url{color:#444}
  .go,.tip,#big{display:none!important}
  .ws{background:#fff;border:2px solid #000}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Ⅶ. 태양계 · 수업 자료</p>
    <h1>🔭 태양계 관측소 모음</h1>
    <p class="lead">휴대폰·태블릿 카메라로 QR 코드를 찍으면 바로 들어가요.</p>
  </header>
  <main class="grid" id="grid"></main>
  <p class="tip">💡 QR 코드를 누르면 TV 화면에 크게 띄울 수 있어요. (다시 누르거나 Esc로 닫기)</p>
</div>
<div id="big" role="dialog" aria-modal="true"><h3 id="bigT"></h3><div class="box" id="bigQ"></div><p id="bigU"></p></div>
<script>
const BASE = 'https://arayoddo-cmd.github.io/';
const L = [
  { no: '1-2', emo: '☀️', t: '태양 관측소', topic: '태양과 태양 활동', ws: '학습지 5~7쪽', repo: 'sun-activity', c: '#ffb347' },
  { no: '2-1', emo: '🌏', t: '일주운동 관측소', topic: '지구의 자전과 일주 운동', ws: '학습지 8~9쪽', repo: 'diurnal-motion', c: '#5fd3ff' },
  { no: '2-2', emo: '♈', t: '별자리 달력 관측소', topic: '지구의 공전과 별자리 변화', ws: '학습지 10~12쪽', repo: 'annual-motion', c: '#c4b0ff' },
  { no: '2-3', emo: '🌙', t: '달 모양 관측소', topic: '달의 위상 변화', ws: '학습지 13~15쪽', repo: 'moon-phase', c: '#ffe27a' }
];
const svg = u => { try { const q = qrcode(0, 'M'); q.addData(u); q.make(); return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch (e) { return '<p style="color:#000;padding:20px">QR을 불러오지 못했어요. 아래 주소로 들어가요.</p>'; } };
const url = l => BASE + l.repo + '/';
document.getElementById('grid').innerHTML = L.map((l, i) => `<section class="card" style="--c:${l.c}">
  <span class="no">${l.no}</span><div class="emo">${l.emo}</div><h2>${l.t}</h2><p class="topic">${l.topic}</p>
  <button class="qr" data-i="${i}" aria-label="${l.t} QR 크게 보기">${svg(url(l))}</button>
  <span class="ws">📒 ${l.ws}</span>
  <a class="go" href="${url(l)}" target="_blank" rel="noopener">바로 들어가기 →</a>
  <div class="url">${url(l).replace('https://', '')}</div></section>`).join('');
const big = document.getElementById('big');
document.addEventListener('click', e => {
  const b = e.target.closest('.qr');
  if (b) { const l = L[b.dataset.i]; document.getElementById('bigT').textContent = `${l.no} ${l.emo} ${l.t}`; document.getElementById('bigQ').innerHTML = svg(url(l)); document.getElementById('bigU').textContent = url(l).replace('https://', ''); big.classList.add('on'); }
  else if (e.target.closest('#big')) big.classList.remove('on');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') big.classList.remove('on'); });
</script>
</body>
</html>
