<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>태양계 탐사대</title>
<meta name="description" content="행성 8개를 직접 탐사하며 특징을 찾고, 지구형·목성형 행성으로 분류한 뒤 퀴즈와 게임으로 복습하는 탐구 활동">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a; --panel:#111934; --line:#2a3768;
  --text:#eef2ff; --muted:#a9b4d8; --accent:#ffcf5a; --accent2:#7cc4ff;
  --ok:#5fe0a0; --bad:#ff8a8a; --chip:#1f2b5a; --chiph:#2b3a78;
  --terra:#ff9f5a; --terrabg:#3a2618; --jov:#5ab8ff; --jovbg:#142a46;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;min-height:100vh}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3,.title{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
h1{font-size:clamp(34px,6vw,58px);line-height:1.15}
h2{font-size:28px}
h3{font-size:22px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#1b1400;border:0;border-radius:999px;padding:12px 24px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
input{font:inherit;color:var(--text);background:#0b1230;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--accent2);border-color:transparent}
label{display:block;font-weight:700;margin:12px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:160px}

/* intro */
.intro{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center;min-height:80vh}
.intro .story{font-size:17px}
.intro .story b{color:var(--accent)}
.intro-planets{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
@media (max-width:820px){.intro{grid-template-columns:1fr;min-height:auto;padding-top:20px}}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .grow{flex:1}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--text)}

/* map */
.system{position:relative;display:flex;align-items:center;gap:6px;overflow:hidden;padding:30px 12px 30px 110px;border-radius:var(--r);border:1px solid var(--line);background:radial-gradient(circle at -60px 50%,#ffb73366 0,#ff8a0022 160px,transparent 300px),#0a1028}
.sun{position:absolute;left:-150px;top:50%;width:230px;height:230px;margin-top:-115px;border-radius:50%;background:radial-gradient(circle at 60% 45%,#fff6c4,#ffd23f 40%,#ff9a1f 75%,#e0590b);box-shadow:0 0 60px #ffae2f}
.sun-label{position:absolute;left:14px;bottom:10px;font-size:13px;color:#ffe3a1}
.pl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;padding:8px 2px;border-radius:12px;position:relative}
.pl:hover{background:#ffffff0d}
.pl svg{max-width:100%;height:auto;transition:transform .2s}
.pl:hover svg{transform:scale(1.07)}
.pl .nm{font-family:"Do Hyeon",sans-serif;font-size:20px}
.pl .st{font-size:12px;color:var(--muted)}
.pl.done .st{color:var(--ok)}
.pl .badge{position:absolute;top:2px;right:6px;font-size:18px}
.map-note{font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:820px){
  .system{flex-wrap:wrap;padding:120px 10px 14px}
  .sun{left:50%;top:-140px;margin:0 0 0 -115px}
  .sun-label{left:50%;transform:translateX(-50%);top:10px;bottom:auto}
  .pl{flex:0 0 calc(25% - 6px)}
}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stage{display:flex;flex-direction:column;gap:8px}
.stage .n{font-family:"Do Hyeon";color:var(--accent);font-size:15px}
.stage .row{margin-top:auto}
@media (max-width:980px){.stages{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.stages{grid-template-columns:1fr}}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.howto .panel{padding:14px}
.howto .n{font-family:"Do Hyeon";color:var(--accent);font-size:22px}
@media (max-width:820px){.howto{grid-template-columns:1fr}}

/* planet */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.pgrid>*{min-width:0}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}}
.hero{display:flex;gap:16px;align-items:center}
.hero .en{color:var(--muted);font-size:15px}
.instr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.instr button{min-width:0;word-break:keep-all;background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:10px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.instr button .ic{font-size:24px;line-height:1}
.instr button:hover{background:var(--chiph)}
.instr button.on{border-color:var(--accent2);background:var(--chiph)}
.instr button.seen::after{content:"✓";position:absolute;top:4px;right:8px;color:var(--ok);font-size:12px}
@media (max-width:520px){.instr button{font-size:12px;padding:8px 4px}.panel{padding:14px}.hero svg{width:90px;height:90px}}
.evidence{min-height:200px;background:#0b1230;border:1px dashed var(--line);border-radius:12px;padding:14px}
.evidence h4{margin:0 0 10px;font-size:16px;color:var(--accent2)}
.evidence ul{margin:6px 0;padding-left:20px}
.evidence li{margin:4px 0}
.ev-empty{display:flex;align-items:center;justify-content:center;min-height:170px;color:var(--muted);text-align:center}
.photo{margin:0;background:#000;border-radius:10px;overflow:hidden}
.photo img{display:block;width:100%;max-height:340px;object-fit:contain;background:#000}
.photo figcaption{padding:8px 10px;font-size:14px;background:#0d1533}
.photo .credit{display:block;font-size:11px;color:var(--muted)}
.photo.broken img{display:none}
.photo.broken figcaption::before{content:"(사진을 불러오지 못했어요) ";color:var(--bad)}
.thumbs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#000;width:64px;height:48px}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.bar{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bar .tr{height:16px;background:#1a2450;border-radius:8px;overflow:hidden}
.bar .fl{height:100%;border-radius:8px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:"Do Hyeon";font-size:34px;color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:8px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.callout{background:#1c2a5c;border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:14px}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px}
.spinrow{display:flex;gap:10px;justify-content:space-around;flex-wrap:wrap;text-align:center}
.spinrow .lbl{font-size:14px}
.spinrow .lbl b{font-family:"Do Hyeon";font-size:18px}

.report h3{margin-bottom:6px}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .s{font-size:17px}
.blank{display:inline-block;min-width:64px;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent);padding:0 6px;font-weight:700}
.blank.ok{border-color:var(--ok);color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.opt:hover{background:var(--chiph)}
.opt.no{opacity:.35;text-decoration:line-through;pointer-events:none}
.opt.sel{background:var(--accent);color:#1b1400;border-color:var(--accent)}
.fb{font-size:14px;margin-top:6px}
.fb.bad{color:var(--bad)}
.fb.ok{color:var(--ok)}
.inq{margin-top:12px;background:linear-gradient(135deg,#2a2160,#162a5a);border:1px solid #5b4fb0;border-radius:12px;padding:14px}
.inq .lbl{font-size:13px;color:#c9b8ff;font-weight:700}
.inq .opts{flex-direction:column;align-items:stretch}
.inq .opt{border-radius:10px;text-align:left}
.explain{background:#0d1a3a;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.done-box{margin-top:14px;text-align:center;padding:16px;border-radius:12px;background:#123a2c;border:1px solid #2f8a64}
.done-box .title{font-size:26px;color:var(--ok)}

/* drag & drop */
[data-drag]{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:rotate(-3deg);box-shadow:0 10px 24px #0008}
.dragging{opacity:.3}
.picked{outline:3px solid var(--accent);outline-offset:2px}
.hoverzone{outline:3px dashed var(--accent);outline-offset:-3px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* lab */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.steps span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.steps span.on{background:var(--accent);color:#1b1400;font-weight:700}
.steps span.ok{background:#123a2c;color:var(--ok)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:#0b1230;margin:12px 0}
.pool .empty{color:var(--muted);font-size:14px;align-self:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border-radius:14px;padding:10px;min-height:170px;display:flex;flex-direction:column;gap:8px}
.bin.b0{background:var(--terrabg);border:2px solid var(--terra)}
.bin.b1{background:var(--jovbg);border:2px solid var(--jov)}
.bin .bh{font-family:"Do Hyeon";font-size:19px;text-align:center}
.bin.b0 .bh{color:var(--terra)}
.bin.b1 .bh{color:var(--jov)}
.bin .chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px}
.pchip b{display:block;font-family:"Do Hyeon";font-weight:400;font-size:17px;line-height:1.1}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tstats div{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
.tstats b{display:block;font-size:24px;color:var(--text)}
.ttbl td{font-size:14px}
.ttbl .tbad{color:var(--bad);font-weight:700}
.ttbl .tok{color:var(--ok);font-weight:700}
.ttbl details{font-size:12px;color:var(--muted);text-align:left;max-width:280px}
.dtbl{margin-top:6px}
.dtbl td:first-child{font-weight:700}
.dtbl th small{font-size:11px}
.pchip.wrong{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
@media (max-width:600px){.bins{grid-template-columns:1fr}}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px}
.chip.g0{background:var(--terrabg);border:1px solid var(--terra)}
.chip.g1{background:var(--jovbg);border:1px solid var(--jov)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-weight:500;font-size:13px}
td:first-child,th:first-child{text-align:left}
.filltbl{min-width:0;table-layout:fixed}
.filltbl th.t{color:var(--terra);font-size:17px;font-family:"Do Hyeon"}
.filltbl th.j{color:var(--jov);font-size:17px;font-family:"Do Hyeon"}
.filltbl td:first-child{width:22%;font-weight:700}
.cell{border:1.5px dashed var(--line);border-radius:8px;height:46px;color:var(--muted);font-size:13px}
.cell.filled{border-style:solid;color:var(--text);font-size:15px;font-weight:700}
.cell.filled.t{background:var(--terrabg);border-color:var(--terra)}
.cell.filled.j{background:var(--jovbg);border-color:var(--jov)}
.filltbl td{padding:4px}
.fcard{background:#2a2160;border:1.5px solid #8b7bff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.twins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.twins{grid-template-columns:1fr}}
.twin{border-radius:12px;padding:14px}
.twin.t{background:var(--terrabg);border:1px solid var(--terra)}
.twin.j{background:var(--jovbg);border:1px solid var(--jov)}
.twin .icons{display:flex;gap:4px;margin:6px 0}
.twin ul{margin:6px 0;padding-left:20px}
.memo{margin-top:12px;background:#2a2160;border:1px dashed #9d8cff;border-radius:12px;padding:12px 14px}

/* quiz game */
.game{max-width:760px;margin:0 auto}
.ghead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prog{flex:1;min-width:140px;height:10px;background:#1a2450;border-radius:6px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.gq{font-size:20px;margin:6px 0 12px}
.gtype{font-size:13px;color:#c9b8ff;font-weight:700}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gopt{background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:17px;display:flex;align-items:center;gap:10px;justify-content:center}
.gopt:hover{background:var(--chiph)}
.gopt.right{border-color:var(--ok);background:#123a2c}
.gopt.wrongpick{border-color:var(--bad);background:#3a1620}
.gopt:disabled{cursor:default}
.gopt svg{flex:none}
.gimg{max-width:420px;margin:0 auto 12px}
.combo{font-family:"Do Hyeon";color:#ff9f5a;font-size:20px}
.stars{font-size:44px;text-align:center;letter-spacing:6px}

/* alggagi */
.alg{max-width:640px;margin:0 auto}
.algbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.algbar .turn{font-family:"Do Hyeon";font-size:22px}
.algstage{position:relative}
#algCanvas{display:block;width:100%;aspect-ratio:1;border-radius:16px;touch-action:none;background:#0a1028}
.algover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#070b1acc;border-radius:16px;text-align:center;padding:16px}
.algover .title{font-size:40px;color:var(--accent)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.lvl{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.lvl span{font-size:13px;color:var(--muted)}
.lvl.on{border-color:var(--accent);background:var(--chiph)}
.lvl:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:700px){.levels{grid-template-columns:1fr}}
details summary{cursor:pointer}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.alg.wide{max-width:980px}
.banner{border-radius:12px;padding:10px 14px;margin:6px 0 8px;font-size:17px;text-align:center;border:2px solid transparent}
.banner.mine{background:#1c2a5c;border-color:var(--tc,#ffcf5a);box-shadow:0 0 14px color-mix(in srgb,var(--tc,#ffcf5a) 45%,transparent)}
.banner.mine b{color:var(--tc,#ffcf5a);font-size:19px}
.banner.wait{background:#0b1230;color:var(--muted);border-color:var(--line)}
.dteams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dteam{border:2px solid;border-radius:14px;padding:12px;background:#0b1230}
.dpicked{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;min-height:40px}
.dpicked span{display:flex;align-items:center;gap:4px;background:var(--chip);border-radius:10px;padding:2px 8px 2px 2px;font-weight:700}
.dpicked .chip{font-style:normal;font-weight:400;margin-left:2px}
.dpool{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.dcard{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.dcard:not(:disabled):hover{border-color:var(--accent);background:var(--chiph)}
.dcard:disabled{cursor:default;opacity:.75}
.dcard b{font-family:"Do Hyeon";font-weight:400;font-size:20px}
.dcard small{font-size:12px;color:var(--muted)}
.dcard .pts{color:var(--accent)}
.dstat{display:grid;grid-template-columns:34px 1fr;gap:3px 6px;align-items:center;width:100%;font-size:12px}
.dstat .tr{height:9px;background:#1a2450;border-radius:5px;overflow:hidden}
.dstat .fl{height:100%;border-radius:5px}
.say{background:#1c2a5c;border-radius:12px;padding:10px 14px;margin-top:10px}
.ptsrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ptsrow span{display:flex;align-items:center;gap:4px;background:var(--chip);border-radius:10px;padding:2px 10px 2px 2px;font-size:14px}
.ptsrow b{color:var(--accent)}
.otbl{min-width:0;font-size:13px;background:#0b1230;border-radius:10px;max-width:560px}
.otbl td,.otbl th{padding:5px 6px}
@media (max-width:760px){.dpool{grid-template-columns:repeat(2,1fr)}.dteams{grid-template-columns:1fr}}
.choice button{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.choice button:hover{border-color:var(--accent)}
.choice .icons{display:flex;gap:2px;margin-bottom:4px}
@media (max-width:600px){.choice{grid-template-columns:1fr}}

/* cert */
.cert{max-width:760px;margin:0 auto;background:linear-gradient(160deg,#1b2552,#0f173a);border:3px double var(--accent);border-radius:18px;padding:28px}
.cert .head{text-align:center}
.cert .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.cert .badges div{text-align:center;font-size:13px;background:#0b1230;border-radius:10px;padding:8px 4px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:12px 0}
.scores div{background:#0b1230;border-radius:12px;padding:10px}
.scores b{display:block;font-family:"Do Hyeon";font-size:30px;color:var(--accent);font-weight:400}
.submit{max-width:760px;margin:16px auto 0}
@media print{#stars,.noprint{display:none!important}body{background:#fff;color:#000}.cert{border-color:#000;background:#fff;color:#000}}

/* 화면을 처음 열 때만 살짝 나타나는 효과 (같은 화면에서 버튼을 누를 때는 없음) */
.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0}to{opacity:1}}
.still .pop{animation:none}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.pl svg{transition:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main id="app"></main>

${slow ? `<div class="callout">⚠️ ${p.ko}의 실제 자전은 지구보다 약 <b>${Math.round(p.rotH / 24)}배</b> 느려요. 그대로 보여 주면 멈춘 것처럼 보여서, 화면에서는 돌아가는 모습이 보이도록 훨씬 빠르게 보여 주고 있어요.</div>` : ''}
<p class="note">노란 화살표: 자전축 · 지구의 하루(24시간)를 ${DAY_SEC}초로 줄여서 보여 줘요.${slow ? '' : ' 두 행성은 같은 빠르기로 비교한 거예요.'}</p>`;
  }
  return '';
}

function viewMap() {
  const sizes = { mercury: 40, venus: 52, earth: 54, mars: 44, jupiter: 104, saturn: 112, uranus: 76, neptune: 72 };

<div class="panel stage"><span class="n">임무 2</span><h3>🔬 행성 분류 실험실</h3><p class="muted">${ld ? '분류 완료! 언제든 다시 복습할 수 있어요.' : all ? '여러 기준으로 행성을 나눠 보세요.' : '임무 1을 통과하면 열려요.'}</p><div class="row"><button class="btn" data-act="lab" ${all ? '' : 'disabled'}>${ld ? '다시 보기' : '입장'}</button></div></div>
<div class="panel stage"><span class="n">임무 3</span><h3>🎮 복습 퀴즈 대모험</h3><p class="muted">${ld ? (played ? `최고 기록 ${state.game.best}점` : '배운 내용을 퀴즈로 복습해요.') : '임무 2를 마치면 열려요.'}</p><div class="row"><button class="btn" data-act="game" ${ld ? '' : 'disabled'}>도전!</button>${played ? '<button class="btn ghost small" data-act="cert">🎖 인증서</button>' : ''}</div></div>
<div class="panel stage"><span class="n">보너스</span><h3>🎯 행성 알까기</h3><p class="muted">${played ? `지구형 팀 vs 목성형 팀! 3단계 도전 (${Math.min(algCleared(), 3)}/3 클리어)` : '임무 3을 한 번 하면 열려요.'}</p><div class="row"><button class="btn" data-act="alg" ${played ? '' : 'disabled'}>놀기</button></div></div>
</div>
${doneCount() === 0 ? `<div class="howto"><div class="panel"><div class="n">1. 증거 모으기</div>행성에 도착하면 탐사 장비 6개를 눌러 실제 사진과 데이터를 살펴봐요.</div><div class="panel"><div class="n">2. 보고서 쓰기</div>증거를 보고 보고서의 빈칸에 알맞은 말을 골라요. 틀리면 어떤 장비를 봐야 하는지 알려줘요.</div><div class="panel"><div class="n">3. 탐구 질문</div>보고서를 다 쓰면 "왜 그럴까?" 질문이 나와요. 맞히면 탐사 완료 🏅</div></div>` : ''}`;
}

function viewPlanet() {
  const p = P[state.cur], s = ps(p.id);
  const k = ui.instr;
  const allQ = p.report.every((_, i) => s.q[i] && s.q[i].ok);
  const idx = PLANETS.indexOf(p), next = PLANETS.slice(idx + 1).concat(PLANETS.slice(0, idx)).find(q => !planetDone(q.id));
  const qs = p.report.map((q, i) => {
    const r = s.q[i] || {}, parts = q.t.split('___');
    const blank = r.ok ? `<span class="blank ok">${q.a}</span>` : '<span class="blank">?</span>';
    const fb = ui.fb[p.id + i];
    return `<div class="q"><div class="s">${i + 1}. ${parts[0]}${blank}${parts[1] || ''}</div>
${r.ok ? '' : `<div class="opts">${shuffled(q.o, q.t + state.m1try).map(o => `<button class="opt${(r.no || []).includes(o) ? ' no' : ''}" data-act="ans" data-i="${i}" data-o="${esc(o)}">${o}</button>`).join('')}</div>`}
${fb ? `<div class="fb ${fb.ok ? 'ok' : 'bad'}">${fb.msg}</div>` : ''}</div>`;
  }).join('');
  const iq = p.inq, ir = s.inq || {};
  const inq = !allQ ? '' : `<div class="inq"><div class="lbl">🤔 탐구 질문</div><p style="font-size:17px;margin-top:4px">${iq.q}</p>
${ir.ok ? `<p class="fb ok">✔ ${iq.o[iq.a]}</p><div class="explain">${iq.ex}</div>` : `<div class="opts">${shuffled(iq.o.map((_, j) => j), p.id + state.m1try).map(j => `<button class="opt${(ir.no || []).includes(j) ? ' no' : ''}" data-act="inq" data-j="${j}">${iq.o[j]}</button>`).join('')}</div>${ui.fb[p.id + 'inq'] ? `<div class="fb bad">${ui.fb[p.id + 'inq']}</div>` : ''}`}</div>`;
  const done = ir.ok ? `<div class="done-box"><div class="title">🏅 ${p.ko} 탐사 완료!</div><p>보고서 내용을 학습지에도 옮겨 적어 보세요.</p>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">${next ? `<button class="btn" data-act="go" data-id="${next.id}">다음 탐사: ${next.ko} →</button>` : m1Pass() ? '<button class="btn" data-act="lab">🔬 분류 실험실로 →</button>' : `<p style="width:100%">8개 행성 중 한 번에 맞힌 비율이 <b style="color:var(--bad)">${m1Pct()}%</b>예요. 60% 이상이어야 임무 2로 갈 수 있어요.</p><button class="btn" data-act="m1retry">🔁 임무 1 다시 풀기</button>`}<button class="btn ghost" data-act="map">지도로</button></div></div>` : '';
  return topBar(backBtn) + `<div class="pgrid pop">
<section class="panel"><div class="hero">${planetSVG(p.id, 120)}<div><h2>${p.ko} <span class="en">${p.en}</span></h2><p class="muted">태양에서 ${p.order}번째 행성</p></div></div>
<div class="instr">${Object.entries(INSTR).map(([key, v]) => `<button class="${k === key ? 'on ' : ''}${s.seen.includes(key) ? 'seen' : ''}" data-act="instr" data-k="${key}" aria-pressed="${k === key}"><span class="ic">${v.ic}</span>${v.name}</button>`).join('')}</div>
<div class="evidence" aria-live="polite">${k ? evidence(p, k) : '<div class="ev-empty">위의 탐사 장비를 눌러<br>증거를 모아 보세요 🔍</div>'}</div></section>
<section class="panel report"><h3>📋 ${p.ko} 탐사 보고서</h3><p class="muted" style="font-size:14px">증거를 보고 빈칸에 들어갈 말을 고르세요.</p>${qs}${inq}${done}</section></div>`;
}

function choiceQ(q, r, i) {
  return `<div class="q"><div class="s">${i + 1}. ${q.q}${r.ok ? ` <span class="blank ok">${q.multi ? q.a.map(j => q.o[j]).join(', ') : q.o[q.a]}</span>` : ''}</div>
${r.ok ? '' : q.multi
    ? `<div class="opts">${q.o.map((o, j) => `<button class="opt${ui.sel.includes(j) ? ' sel' : ''}" data-act="msel" data-j="${j}">${o}</button>`).join('')}</div><div style="margin-top:8px"><button class="btn small" data-act="lq" data-i="${i}" data-j="-1">확인</button></div>`
    : `<div class="opts">${q.o.map((o, j) => `<button class="opt${(r.no || []).includes(j) ? ' no' : ''}" data-act="lq" data-i="${i}" data-j="${j}">${o}</button>`).join('')}</div>`}
${r.msg ? `<div class="fb bad">${r.msg}</div>` : ''}</div>`;
}

// 행성 카드에는 이름만 보여 주고, 값은 위의 탐사 자료 표에서 직접 찾게 해요
function pchip(p, wrong) {
  const pk = ui.picked && ui.picked.kind === 'crit' && ui.picked.id === p.id;
  return `<div class="pchip${wrong ? ' wrong' : ''}${pk ? ' picked' : ''}${ui.shake === p.id ? ' shake' : ''}" data-drag="${p.id}" data-kind="crit">${planetSVG(p.id, 36)}<span><b>${p.ko}</b></span></div>`;
}
function dataTable() {
  return `<div class="tbl-wrap"><table class="dtbl"><thead><tr><th>행성</th><th>반지름<br><small>(지구 = 1)</small></th><th>질량<br><small>(지구 = 1)</small></th><th>위성 수</th><th>고리</th><th>표면</th></tr></thead><tbody>
${PLANETS.map(p => `<tr><td>${p.ko}</td><td>${p.d}</td><td>${p.m}</td><td>${p.moons}</td><td>${p.ring}</td><td>${p.surface.replace(' (단단한 표면 없음)', '')}</td></tr>`).join('')}</tbody></table></div>`;
}

function viewLab() {
  const L = state.lab;
  const cur = curCrit();
  const steps = `<div class="steps">${CRIT.map((c, i) => `<span class="${critOk(i) ? 'ok' : i === cur ? 'on' : ''}">${critOk(i) ? '✔ ' : ''}${c.title}</span>`).join('')}<span class="${conclOk() ? 'ok' : cur === -1 ? 'on' : ''}">${conclOk() ? '✔ ' : ''}결론</span><span class="${tblDone() ? 'ok' : conclOk() ? 'on' : ''}">${tblDone() ? '✔ ' : ''}표 완성</span><span class="${labDone() ? 'ok' : tblDone() ? 'on' : ''}">${labDone() ? '✔ ' : ''}확인 문제</span></div>`;
  let body = '';
  if (cur !== -1) {
    const c = CRIT[cur], st = L.c[c.id] || { g: {} }, wrong = (ui.fb.crit && ui.fb.crit.id === c.id) ? ui.fb.crit.wrong : [];
    const pool = PLANETS.filter(p => st.g[p.id] === undefined);
    const bin = j => `<div class="bin b${j}" data-drop="${j}" data-act="zone"><div class="bh">${c.bins[j]}</div><div class="chips">${PLANETS.filter(p => st.g[p.id] === j).map(p => pchip(p, wrong.includes(p.id))).join('')}</div></div>`;
    body = `<section class="panel"><h3>📡 행성 탐사 자료</h3><p class="muted" style="font-size:14px;margin:0">아래 표에서 필요한 값을 직접 찾아 행성을 나눠 보세요.</p>${dataTable()}</section>
<section class="panel" style="margin-top:14px"><p class="muted" style="margin:0">기준 ${cur + 1} / ${CRIT.length}</p><h3>${c.by} 나누기</h3><p>${c.ask}</p>
<p class="note">위 표에서 <b>${c.title}</b> 값을 찾아보고, 행성 카드를 끌어서 알맞은 칸에 놓으세요. 카드를 누른 다음 칸을 눌러도 돼요.</p>
<div class="pool" data-drop="pool" data-act="zone">${pool.length ? pool.map(p => pchip(p, false)).join('') : '<span class="empty">모든 행성을 나눴어요! 확인해 보세요.</span>'}</div>
<div class="bins">${bin(0)}${bin(1)}</div>
<div class="row" style="margin-top:12px"><button class="btn" data-act="ccheck" ${pool.length ? 'disabled' : ''}>확인하기</button><span class="muted" style="font-size:14px">${pool.length ? `아직 ${pool.length}개 남았어요.` : ''}</span></div>
${wrong.length ? `<p class="fb bad">🔎 ${wrong.length}개 행성이 다른 칸에 있어요. 빨간 테두리 행성의 값을 위 표에서 다시 찾아보세요.</p>` : ''}</section>`;
  } else {
    const matrix = `<div class="tbl-wrap"><table><thead><tr><th>행성</th>${CRIT.map(c => `<th>${c.title}</th>`).join('')}</tr></thead><tbody>
${PLANETS.map(p => `<tr><td>${p.ko}</td>${CRIT.map(c => { const g = c.g(p); return `<td><span class="chip g${g}">${c.bins[g]}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
    const cr = L.concl || {};
    body = `<section class="panel"><h3>📊 다섯 가지 기준으로 나눈 결과</h3><p class="muted">주황색과 파란색이 어떻게 나뉘었는지 살펴보세요.</p>${matrix}
<div class="inq"><div class="lbl">🤔 결론</div><p style="font-size:17px;margin-top:4px">${CONCL.q}</p>
${cr.ok ? `<p class="fb ok">✔ ${CONCL.o[CONCL.a]}</p><div class="explain">어떤 기준으로 나눠도 행성들은 <b>항상 같은 두 무리</b>로 나뉘어요. 그래서 태양계 행성은 특징에 따라 <b>두 무리로 나눌 수 있어요!</b><br>과학자들은 지구와 특징이 비슷한 무리를 <b style="color:var(--terra)">지구형 행성</b>, 목성과 특징이 비슷한 무리를 <b style="color:var(--jov)">목성형 행성</b>이라고 불러요.</div>`
      : `<div class="opts">${CONCL.o.map((o, j) => `<button class="opt${(cr.no || []).includes(j) ? ' no' : ''}" data-act="concl" data-j="${j}">${o}</button>`).join('')}</div>${ui.fb.concl ? `<div class="fb bad">${ui.fb.concl}</div>` : ''}`}</div></section>`;
    if (cr.ok) body += viewTable();
    if (cr.ok && tblDone()) {
      const icons = ids => `<div class="icons">${ids.map(id => planetSVG(id, 40)).join('')}</div>`;
      body += `<section class="panel" style="margin-top:14px"><h3>🪐 정리: 지구형 행성과 목성형 행성</h3>
<div class="twins" style="margin-top:10px">
<div class="twin t"><h3 style="color:var(--terra)">지구형 행성</h3>${icons(TERRA)}<b>수성, 금성, 지구, 화성</b><ul>
<li>태양에 가깝다 (소행성대 안쪽)</li><li>크기와 질량이 작다</li><li>단단한 암석 표면이 있다</li><li>위성이 없거나 적다</li><li>고리가 없다</li><li>자전이 느린 편이다 (하루 24시간 이상)</li></ul></div>

function buildRound() {
  const qs = [];
  // 보기는 정답과 같은 무리의 행성 4개로 만들어서, 무리만 알아서는 맞힐 수 없게 해요
  const sameGroup = (id, seed) => shuffled(isT(id) ? TERRA : JOVI, seed);
  QUIZ.forEach((x, n) => {
    const seed = 'quiz' + n;
    const pick = (id, type, q, ex, img) => { const o = sameGroup(id, seed); qs.push({ type, q, img, o: o.map(y => ({ id: y, t: P[y].ko })), a: o.indexOf(id), ex }); };
    if (x.k === 'who') pick(x.id, '🔍 나는 누구일까?', `"${x.t}" — 나는 누구일까요?`, `정답은 ${P[x.id].ko}이에요.`);
    else if (x.k === 'photo') pick(x.id, '📷 사진 퀴즈', '이 사진은 어느 행성일까요?', x.ex, x.img);
    else if (x.k === 'data') pick(x.id, '📡 탐사 자료 분석', `탐사선이 보내온 자료예요. 어느 행성일까요?<br><span class="muted" style="font-size:15px">${x.t}</span>`, `${P[x.id].ko}의 자료예요.`);
    else if (x.k === 'ox') qs.push({ type: '⭕ O / X', q: x.t, o: [{ t: '⭕ 맞다' }, { t: '❌ 틀리다' }], a: x.v ? 0 : 1, ex: x.ex });
    else if (x.k === 'why') { const o = shuffled([x.ok].concat(x.no), seed); qs.push({ type: '🤔 까닭 찾기', q: x.t, o: o.map(y => ({ t: y })), a: o.indexOf(x.ok), ex: x.ex }); }
    else if (x.k === 'feat') qs.push({ type: '🪐 무리 나누기', q: `"${x.t}" — 어느 무리의 특징일까요?`, o: GROUPS.map(t => ({ t })), a: x.g, ex: `${GROUPS[x.g]}의 특징이에요.` });
  });
  return { qs, i: 0, score: 0, combo: 0, maxCombo: 0, right: 0, picked: null };
}

function draftCard(id, D, canPick) {

function draftAiPick(D) {
  const left = PLANETS.map(p => p.id).filter(id => !D.picks[0].includes(id) && !D.picks[1].includes(id));
  const val = id => algM(id) * 2 + launchK(algM(id)) * 1.5 - PTS[id] * 0.6 + Math.random() * 1.2;
  const id = left.sort((a, b) => val(b) - val(a))[0];
  const heaviest = left.every(x => algM(x) <= algM(id)), lightest = left.every(x => PTS[x] >= PTS[id]);

  D.say = `🤖 "저는 <b>${P[id].ko}</b>${josa(P[id].ko, '을', '를').slice(-1)} 고를게요. ${why}"`;

    const c = CRIT[curCrit()], st = state.lab.c[c.id];
    st.tries++;
    const wrong = PLANETS.filter(p => st.g[p.id] !== c.g(p)).map(p => p.id);
    if (!wrong.length) { st.ok = true; ui.fb.crit = null; save(); go('lab'); return; }
    ui.fb.crit = { id: c.id, wrong }; save(); render();
  } else if (a === 'concl') {
    const r = state.lab.concl || (state.lab.concl = { no: [] }), j = +t.dataset.j;
    answer(r, j === CONCL.a, j);
    ui.fb.concl = r.ok ? '' : '🔎 표에서 주황색으로 칠해진 행성들을 다시 살펴보세요.';
    save(); render();
  } else if (a === 'msel') {
    const j = +t.dataset.j; ui.sel = ui.sel.includes(j) ? ui.sel.filter(x => x !== j) : ui.sel.concat(j); render();
  } else if (a === 'lq') {
    const i = +t.dataset.i, q = LQUIZ[i], r = state.lab.quiz[i] || (state.lab.quiz[i] = { no: [] });
    if (q.multi) {
      const ok = ui.sel.length === q.a.length && q.a.every(j => ui.sel.includes(j));
      if (ok) { r.ok = true; r.msg = ''; ui.sel = []; } else { r.tries = (r.tries || 0) + 1; r.msg = '🔎 다시 골라 보세요. 지구형 행성은 태양에 가까운 4개 행성이에요.'; }
    } else {
      const j = +t.dataset.j; answer(r, j === q.a, j); r.msg = r.ok ? '' : '🔎 위의 표를 다시 살펴보세요.';
    }
    save(); render();
  } else if (a === 'game') { ui.round = buildRound(); go('game'); }
  else if (a === 'gans') {
    const R = ui.round, j = +t.dataset.j, q = R.qs[R.i];
    if (R.picked !== null) return;
    R.picked = j;
    if (j === q.a) { R.right++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo); R.score += 10 + Math.min(10, (R.combo - 1) * 2); } else R.combo = 0;
    render();
  } else if (a === 'gnext') {
    const R = ui.round; R.i++; R.picked = null;
    if (R.i >= R.qs.length) {
      const G = state.game; G.plays++;
      if (R.score > G.best) { G.best = R.score; G.bestRight = R.right; }
      save();
    }
    render(); window.scrollTo(0, 0);
  } else if (a === 'alg' || a === 'algSetup') { algStop(); ui.alg = null; go('alg'); }
  else if (a === 'algLv') { ui.algLv = +t.dataset.lv; render(); }
  else if (a === 'draftStart') { ui.alg = draftNew(t.dataset.mode, algLevel()); go('alg'); }
  else if (a === 'dpick') {
    const D = ui.alg; if (!D || D.phase !== 'draft' || D.step >= 8) return;
    if (D.mode === 'ai' && DRAFT_ORDER[D.step] !== D.human) return;
    D.say = ''; draftPick(D, t.dataset.id); render();
  } else if (a === 'dstart') { const D = ui.alg; ui.alg = algNew(D.mode, D.human, D.level, 'draft', D.picks); go('alg'); }
  else if (a === 'algStart') { ui.alg = algNew(t.dataset.mode, +t.dataset.team, algLevel(), 'classic'); go('alg'); }
  else if (a === 'algAgain' || a === 'algNext') {
    const o = ui.alg, lv = a === 'algNext' ? o.level + 1 : o.level; algStop();
    if (a === 'algNext') ui.algLv = lv;
    ui.alg = o.rule === 'classic' ? algNew(o.mode, o.human, lv, 'classic') : draftNew(o.mode, lv);
    lastKey = ''; render(); window.scrollTo(0, 0);
  }
  else if (a === 'teacher') { ui.teacher = null; go('teacher'); }
  else if (a === 'tload') teacherLoad();
  else if (a === 'tcls') { ui.teacher.cls = t.dataset.c; render(); }
  else if (a === 'tdetail') { ui.teacher.detail = !ui.teacher.detail; render(); }
  else if (a === 'tout') { ui.teacher = null; go('intro'); }
  else if (a === 'cert') go('cert');
  else if (a === 'print') window.print();
  else if (a === 'submit') submit();
});

/* ───────── 선생님께 진행 상황 보내기 ─────────
   임무 진행 상태가 바뀔 때마다 자동으로 보내요. 시트에는 학생 한 명당 한 줄로 저장돼요. */
async function post(body) {
  const res = await fetch(CONFIG.SUBMIT_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}
function progress() {
  const sc = scoreInfo(), G = state.game;
  return {
    code: state.code, num: state.num, name: state.name,
    m1: `${doneCount()}/8`, m1pass: m1Pass(), m1try: state.m1try + 1, m2: m1Pass() && labDone(), bonus: Math.min(algCleared(), 3),
    explore: `${sc.ex}/${sc.exN}`, lab: `${sc.lab}/${sc.labN}`,
    gameBest: G.best, gameRight: `${G.bestRight}/15`, gamePlays: G.plays,
    planets: sc.per.map(x => `${x.p.ko} ${x.f}/${x.n}`).join(', '),
    critTries: CRIT.map(c => `${c.title} ${(state.lab.c[c.id] || {}).tries || 0}회`).join(', ') + `, 표 완성 실수 ${state.lab.tbl.miss}회`
  };
}
async function sync(force) {
  if (!CONFIG.SUBMIT_URL || !state.code || !state.num) return null;
  const p = progress(), sig = [p.num, p.name, p.m1, p.m1pass, p.m1try, p.m2, p.gamePlays, p.gameBest, p.bonus].join('|');
  if (!force && sig === state.sentSig) return null;
  try {
    const out = await post(p);
    if (out.ok) { state.sentSig = sig; state.sent = true; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    return out;
  } catch (err) { return { ok: false, error: 'net' }; }
}
async function submit() {
  const inp = document.getElementById('code');
  if (inp) { if (!inp.value.trim()) { ui.submitMsg = '수업 코드를 입력해 주세요.'; render(); return; } state.code = inp.value.trim(); }
  ui.submitMsg = '전송 중…'; render();
  const out = await sync(true);
  if (out && out.ok) ui.submitMsg = '✔ 선생님께 보냈어요.';
  else if (out && out.error === 'code') { state.code = ''; ui.submitMsg = '수업 코드가 맞지 않아요. 다시 확인해 주세요.'; }
  else ui.submitMsg = '인터넷 연결을 확인해 주세요. 계속 안 되면 인증서를 캡처해서 제출하세요.';
  save(); render();
}

/* ───────── 별 배경 ───────── */
(function stars() {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  function draw() {
    c.width = innerWidth; c.height = innerHeight;
    for (let i = 0; i < 220; i++) {
      x.fillStyle = `rgba(255,255,255,${Math.random() * .7 + .1})`;
      x.beginPath(); x.arc(Math.random() * c.width, Math.random() * c.height, Math.random() * 1.3, 0, 7); x.fill();
    }
  }
  draw(); addEventListener('resize', draw);
})();

if (state.view === 'game' || state.view === 'alg') state.view = 'map';
render();
</script>
