<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>말랑 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    font-family: 'Jua', sans-serif;
    background: linear-gradient(160deg, #ffe4f1 0%, #fff4e0 50%, #e3f0ff 100%);
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block; border-radius: 26px; background: #fffaf5;
    box-shadow: 0 0 0 6px #fff, 0 14px 40px rgba(255, 130, 180, .35);
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const W = 480, H = 720, HUD = 58;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1;

  function resize() {
    scale = Math.min((innerWidth - 20) / W, (innerHeight - 20) / H);
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 사운드 ----------
  let actx = null, muted = false;
  function beep(f, d = 0.08, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
  const sfx = {
    paddle: () => beep(330, 0.1, 'triangle', 0.14, 1.5),
    wall: () => beep(220, 0.05, 'sine', 0.08),
    brick: (c) => beep(NOTES[Math.min(c, NOTES.length - 1)], 0.12, 'square', 0.06),
    tough: () => beep(260, 0.08, 'triangle', 0.12, 0.7),
    power: () => { [660, 880, 1100].forEach((f, i) => beep(f, 0.1, 'triangle', 0.1, 0, i * 0.07)); },
    lose: () => { [440, 370, 300, 220].forEach((f, i) => beep(f, 0.18, 'triangle', 0.12, 0, i * 0.12)); },
    clear: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, 0.14, 'square', 0.07, 0, i * 0.1)); },
    start: () => { beep(523, 0.1, 'triangle', 0.12); beep(784, 0.15, 'triangle', 0.12, 0, 0.09); }
  };

  // ---------- 데이터 ----------
  const PAL = ['#ff9ec4', '#ffb98a', '#ffe07a', '#9ee6b4', '#8fd3ff', '#c3a6ff', '#ffa6e0'];
  const LEVELS = [
    [ // 하트
      '.11..11.',
      '11111111',
      '11111111',
      '.111111.',
      '..1111..',
      '...11...'
    ],
    [ // 고양이
      '1......1',
      '11....11',
      '11111111',
      '12111121',
      '11111111',
      '11122111',
      '.111111.'
    ],
    [ // 체크무늬
      '22222222',
      '1.1.1.1.',
      '.1.1.1.1',
      '11111111',
      '1.2112.1',
      '11111111'
    ],
    [ // 버섯
      '..2222..',
      '.211112.',
      '21121121',
      '22222222',
      '..1111..',
      '..1..1..',
      '..1111..'
    ]
  ];
  const POWERS = [
    { type: 'wide', icon: '🍓', w: 4 },
    { type: 'multi', icon: '⭐', w: 3 },
    { type: 'slow', icon: '🐢', w: 3 },
    { type: 'life', icon: '💖', w: 1 }
  ];

  let best = 0;
  try { best = +localStorage.getItem('mallang-best') || 0; } catch (e) {}

  // ---------- 상태 ----------
  let state = 'title'; // title | play | pause | clear | over
  let level = 0, score = 0, lives = 3, combo = 0;
  let bricks = [], balls = [], powerups = [], particles = [], popups = [];
  let wideT = 0, slowT = 0, shake = 0, time = 0, newBest = false;
  const paddle = { x: W / 2, tx: W / 2, y: H - 74, w: 96, tw: 96, h: 20, sq: 0, happy: 0 };
  const keys = { left: false, right: false };
  const clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random() * W, y: 90 + i * 100, s: 0.6 + Math.random() * 0.7, v: 6 + Math.random() * 10 }));

  const baseSpeed = () => Math.min(330 + level * 18, 540);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function genLevel(n) {
    const rows = Math.min(5 + Math.floor(n / 2), 9), out = [];
    const toughRate = Math.min(0.1 * n, 0.5);
    for (let r = 0; r < rows; r++) {
      let s = '';
      for (let c = 0; c < 4; c++) {
        const v = Math.random();
        s += v < 0.15 ? '.' : v < 0.15 + toughRate ? (n > 5 && Math.random() < 0.35 ? '3' : '2') : '1';
      }
      out.push(s + s.split('').reverse().join(''));
    }
    return out;
  }

  function buildLevel(n) {
    bricks = [];
    const pat = n < LEVELS.length ? LEVELS[n] : genLevel(n);
    const cols = 8, gap = 6, side = 20, bh = 28, top = HUD + 34;
    const bw = (W - side * 2 - gap * (cols - 1)) / cols;
    pat.forEach((row, r) => {
      for (let c = 0; c < cols; c++) {
        const ch = row[c];
        if (!ch || ch === '.') continue;
        const hp = +ch;
        bricks.push({ x: side + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh, hp, max: hp,
          color: PAL[(r + n) % PAL.length], sq: 0, bob: Math.random() * 6.28 });
      }
    });
  }

  function resetBall() {
    balls = [{ x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, r: 10, stuck: true, off: 0, trail: [] }];
  }

  function newGame() {
    level = 0; score = 0; lives = 3; combo = 0; newBest = false;
    startLevel();
  }

  function startLevel() {
    buildLevel(level);
    powerups = []; wideT = 0; slowT = 0; paddle.tw = 96;
    resetBall();
    state = 'play';
    sfx.start();
  }

  function launch() {
    for (const b of balls) {
      if (!b.stuck) continue;
      const a = (Math.random() * 40 - 20) * Math.PI / 180;
      const sp = baseSpeed();
      b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.stuck = false;
      sfx.paddle();
    }
  }

  function action() {
    if (state === 'title' || state === 'over') newGame();
    else if (state === 'clear') { level++; startLevel(); }
    else if (state === 'pause') state = 'play';
    else if (state === 'play') launch();
  }

  // ---------- 입력 ----------
  function toGame(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  const muteBtn = { x: W - 46, y: 12, w: 34, h: 34 };
  const inMute = (p) => p.x > muteBtn.x - 4 && p.x < muteBtn.x + muteBtn.w + 4 && p.y > muteBtn.y - 4 && p.y < muteBtn.y + muteBtn.h + 4;

  addEventListener('pointermove', (e) => { paddle.tx = toGame(e).x; });
  cv.addEventListener('pointerdown', (e) => {
    const p = toGame(e);
    if (inMute(p)) { muted = !muted; if (!muted) beep(880, 0.08, 'triangle'); return; }
    paddle.tx = p.x;
    action();
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play';
    } else if (e.key === 'm' || e.key === 'M') muted = !muted;
  });
  addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

  // ---------- 이펙트 ----------
  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.7 + Math.random() * 0.5, t: 0,
        kind: Math.random() < 0.45 ? 'heart' : Math.random() < 0.5 ? 'star' : 'dot',
        color: Math.random() < 0.3 ? '#fff' : color, size: 5 + Math.random() * 6, rot: Math.random() * 6 });
    }
  }
  function popup(x, y, text, color = '#ff6fa5') { popups.push({ x, y, text, color, t: 0 }); }

  // ---------- 업데이트 ----------
  function hitBrick(br, i) {
    br.hp--; br.sq = 1;
    if (br.hp <= 0) {
      bricks.splice(i, 1);
      combo++;
      const pts = 10 * combo;
      score += pts;
      burst(br.x + br.w / 2, br.y + br.h / 2, br.color, 12);
      popup(br.x + br.w / 2, br.y, combo > 1 ? `+${pts} x${combo}` : `+${pts}`);
      sfx.brick(combo - 1);
      shake = Math.min(shake + 2, 6);
      if (Math.random() < 0.16) {
        const total = POWERS.reduce((s, p) => s + p.w, 0);
        let r = Math.random() * total, pick = POWERS[0];
        for (const p of POWERS) { r -= p.w; if (r <= 0) { pick = p; break; } }
        powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, vy: 130, ...pick, t: 0 });
      }
    } else {
      score += 5;
      burst(br.x + br.w / 2, br.y + br.h / 2, '#fff', 5);
      sfx.tough();
    }
  }

  function applyPower(p) {
    sfx.power();
    paddle.happy = 1;
    burst(p.x, paddle.y, '#ffd84d', 10);
    if (p.type === 'wide') { wideT = 12; popup(p.x, paddle.y - 20, '길어졌다!', '#ff7aa8'); }
    else if (p.type === 'slow') { slowT = 10; popup(p.x, paddle.y - 20, '느릿느릿~', '#5cbf7e'); }
    else if (p.type === 'life') { lives = Math.min(lives + 1, 5); popup(p.x, paddle.y - 20, '목숨 +1', '#ff5c8a'); }
    else if (p.type === 'multi') {
      popup(p.x, paddle.y - 20, '공 분신술!', '#f2a900');
      const add = [];
      for (const b of balls) {
        if (b.stuck) continue;
        for (const da of [-0.4, 0.4]) {
          if (balls.length + add.length >= 12) break;
          const c = Math.cos(da), s = Math.sin(da);
          add.push({ x: b.x, y: b.y, vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c, r: b.r, stuck: false, trail: [] });
        }
      }
      balls.push(...add);
    }
  }

  function stepBall(b, dt) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); sfx.wall(); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx.wall(); }
    if (b.y < HUD + b.r) { b.y = HUD + b.r; b.vy = Math.abs(b.vy); sfx.wall(); }

    const pl = paddle.x - paddle.w / 2, pr = paddle.x + paddle.w / 2;
    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h && b.x >= pl - b.r && b.x <= pr + b.r) {
      const rel = clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1);
      const a = rel * 62 * Math.PI / 180;
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp;
      b.y = paddle.y - b.r;
      paddle.sq = 1; combo = 0;
      sfx.paddle();
    }

    for (let i = 0; i < bricks.length; i++) {
      const br = bricks[i];
      const cx = clamp(b.x, br.x, br.x + br.w), cy = clamp(b.y, br.y, br.y + br.h);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy < b.r * b.r) {
        if (dx === 0 && dy === 0) b.vy = -b.vy;
        else if (Math.abs(dx) > Math.abs(dy)) b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
        else b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
        hitBrick(br, i);
        break;
      }
    }
    return b.y - b.r > H;
  }

  function update(dt) {
    time += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 60) c.x = -60; }

    if (keys.left) paddle.tx = Math.min(paddle.tx, paddle.x) - 620 * dt;
    if (keys.right) paddle.tx = Math.max(paddle.tx, paddle.x) + 620 * dt;
    paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 10);
    paddle.tx = clamp(paddle.tx, paddle.w / 2, W - paddle.w / 2);
    paddle.x += (paddle.tx - paddle.x) * Math.min(1, dt * 22);
    paddle.sq = Math.max(0, paddle.sq - dt * 5);
    paddle.happy = Math.max(0, paddle.happy - dt * 1.5);
    shake = Math.max(0, shake - dt * 30);

    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.rot += dt * 4; }
    particles = particles.filter(p => p.t < p.life);
    for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
    popups = popups.filter(p => p.t < 0.9);
    for (const br of bricks) br.sq = Math.max(0, br.sq - dt * 5);

    if (state !== 'play') return;

    if (wideT > 0) { wideT -= dt; paddle.tw = wideT > 0 ? 150 : 96; }
    if (slowT > 0) slowT -= dt;

    const target = baseSpeed() * (slowT > 0 ? 0.68 : 1);
    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x + b.off; b.y = paddle.y - b.r - 1; b.trail = []; continue; }
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const ns = sp + (target - sp) * Math.min(1, dt * 3);
      b.vx *= ns / sp; b.vy *= ns / sp;
      // 너무 수평으로 날아가지 않게
      if (Math.abs(b.vy) < ns * 0.28) { b.vy = Math.sign(b.vy || -1) * ns * 0.28; b.vx = Math.sign(b.vx) * Math.sqrt(ns * ns - b.vy * b.vy); }
      b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 8) b.trail.shift();
      const steps = Math.ceil(ns * dt / 4), sub = dt / steps;
      for (let s = 0; s < steps; s++) if (stepBall(b, sub)) { b.dead = true; break; }
    }
    balls = balls.filter(b => !b.dead);

    if (balls.length === 0) {
      lives--; combo = 0; shake = 8;
      sfx.lose();
      if (lives <= 0) {
        state = 'over';
        if (score > best) { best = score; newBest = true; try { localStorage.setItem('mallang-best', best); } catch (e) {} }
      } else {
        wideT = 0; slowT = 0; paddle.tw = 96; powerups = [];
        resetBall();
      }
    }

    for (const p of powerups) {
      p.t += dt; p.y += p.vy * dt;
      if (p.y + 14 >= paddle.y && p.y - 14 <= paddle.y + paddle.h && Math.abs(p.x - paddle.x) < paddle.w / 2 + 14) {
        p.got = true; applyPower(p);
      }
    }
    powerups = powerups.filter(p => !p.got && p.y < H + 30);

    if (bricks.length === 0 && state === 'play') {
      state = 'clear';
      score += 100 + lives * 20;
      if (score > best) { best = score; newBest = true; try { localStorage.setItem('mallang-best', best); } catch (e) {} }
      sfx.clear();
      for (let i = 0; i < 6; i++) burst(60 + Math.random() * (W - 120), 200 + Math.random() * 200, PAL[i % PAL.length], 14);
    }
  }

  // ---------- 그리기 ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 0.9, y - s * 0.25, x - s * 0.45, y - s * 0.95, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.45, y - s * 0.95, x + s * 0.9, y - s * 0.25, x, y + s * 0.35);
    ctx.closePath();
  }
  function starPath(x, y, s, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? s * 0.45 : s, a = rot + i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath();
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => clamp(Math.round(v + amt), 0, 255);
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }
  function text(str, x, y, size, color, align = 'center', stroke = '#fff') {
    ctx.font = `${size}px Jua, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineWidth = size * 0.22; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fff3f8'); g.addColorStop(1, '#eef6ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,190,215,.18)';
    for (let y = 0; y < H; y += 40) for (let x = (y / 40) % 2 ? 20 : 0; x < W; x += 40) {
      ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const c of clouds) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      ctx.beginPath(); ctx.arc(-22, 6, 16, 0, 7); ctx.arc(0, -4, 22, 0, 7); ctx.arc(24, 6, 15, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  function drawHud() {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillRect(0, 0, W, HUD);
    ctx.fillStyle = '#ffd1e3'; ctx.fillRect(0, HUD - 3, W, 3);
    text(`점수 ${score}`, 16, HUD / 2, 22, '#ff6fa5', 'left', null);
    text(`STAGE ${level + 1}`, W / 2 - 20, HUD / 2, 20, '#8a7bd6', 'center', null);
    for (let i = 0; i < lives; i++) {
      heartPath(W - 70 - i * 22, HUD / 2 + 2, 11 + Math.sin(time * 4 + i) * 0.8);
      ctx.fillStyle = '#ff6f9a'; ctx.fill();
    }
    rr(muteBtn.x, muteBtn.y, muteBtn.w, muteBtn.h, 10);
    ctx.fillStyle = '#ffe9f2'; ctx.fill();
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(muted ? '🔇' : '🔊', muteBtn.x + muteBtn.w / 2, muteBtn.y + muteBtn.h / 2 + 1);
  }

  function drawFaceEyes(cx, cy, mode, sz = 1) {
    ctx.strokeStyle = ctx.fillStyle = '#5a3a4a';
    ctx.lineWidth = 2 * sz; ctx.lineCap = 'round';
    const ex = 7 * sz;
    if (mode === 'ouch') {
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + s * ex - 3 * sz * s, cy - 3 * sz); ctx.lineTo(cx + s * ex + 2 * sz * s, cy); ctx.lineTo(cx + s * ex - 3 * sz * s, cy + 3 * sz);
        ctx.stroke();
      }
    } else if (mode === 'happy') {
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * ex, cy + 1 * sz, 3 * sz, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    } else if (mode === 'tough') {
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(cx + s * ex, cy + 1 * sz, 2.2 * sz, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx + s * (ex + 4 * sz), cy - 4 * sz); ctx.lineTo(cx + s * (ex - 3 * sz), cy - 2 * sz); ctx.stroke();
      }
    } else {
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(cx + s * ex, cy, 2.4 * sz, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + s * ex + 0.8 * sz, cy - 0.9 * sz, 0.9 * sz, 0, 7); ctx.fill();
        ctx.fillStyle = '#5a3a4a';
      }
    }
  }

  function drawBricks() {
    for (const br of bricks) {
      const bob = Math.sin(time * 2.4 + br.bob) * 1.2;
      const sq = br.sq;
      const w = br.w * (1 + sq * 0.12), h = br.h * (1 - sq * 0.18);
      const x = br.x + (br.w - w) / 2, y = br.y + (br.h - h) / 2 + bob;
      rr(x, y + 3, w, h, 10); ctx.fillStyle = shade(br.color, -40); ctx.fill();
      rr(x, y, w, h, 10); ctx.fillStyle = br.color; ctx.fill();
      if (br.max > 1) {
        ctx.lineWidth = 2.5; ctx.strokeStyle = br.hp > 1 ? '#fff' : 'rgba(255,255,255,.4)';
        ctx.setLineDash(br.hp > 2 ? [] : [4, 3]); rr(x + 2, y + 2, w - 4, h - 4, 8); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      rr(x + 5, y + 3, w * 0.35, 4, 2); ctx.fill();
      const cx = x + w / 2, cy = y + h / 2 + 1;
      ctx.fillStyle = 'rgba(255,120,150,.45)';
      ctx.beginPath(); ctx.ellipse(cx - 13, cy + 4, 3.5, 2.2, 0, 0, 7); ctx.ellipse(cx + 13, cy + 4, 3.5, 2.2, 0, 0, 7); ctx.fill();
      drawFaceEyes(cx, cy - 1, sq > 0.2 ? 'ouch' : br.hp > 1 ? 'tough' : 'normal', 0.85);
      ctx.beginPath();
      if (sq > 0.2) { ctx.ellipse(cx, cy + 5, 2.4, 2.8, 0, 0, 7); ctx.fillStyle = '#5a3a4a'; ctx.fill(); }
      else { ctx.arc(cx - 2, cy + 3, 2, 0.1, Math.PI - 0.1); ctx.moveTo(cx + 4, cy + 3); ctx.arc(cx + 2, cy + 3, 2, 0.1, Math.PI - 0.1); ctx.lineWidth = 1.6; ctx.stroke(); }
    }
  }

  function drawPaddle() {
    const sq = paddle.sq;
    const w = paddle.w * (1 + sq * 0.08), h = paddle.h * (1 - sq * 0.25);
    const x = paddle.x - w / 2, y = paddle.y + (paddle.h - h);
    const body = wideT > 0 ? '#ff8fb8' : '#ffb3cf';
    // 귀
    for (const s of [-1, 1]) {
      const ex = paddle.x + s * (w / 2 - 16);
      ctx.beginPath(); ctx.moveTo(ex - 10, y + 4); ctx.lineTo(ex + s * 3, y - 11 + sq * 4); ctx.lineTo(ex + 10, y + 4); ctx.closePath();
      ctx.fillStyle = body; ctx.fill();
      ctx.beginPath(); ctx.moveTo(ex - 5, y + 3); ctx.lineTo(ex + s * 2, y - 5 + sq * 4); ctx.lineTo(ex + 5, y + 3); ctx.closePath();
      ctx.fillStyle = '#fff0f6'; ctx.fill();
    }
    rr(x, y + 4, w, h, h / 2); ctx.fillStyle = shade('#ffb3cf', -45); ctx.fill();
    rr(x, y, w, h, h / 2); ctx.fillStyle = body; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; rr(x + 12, y + 3, w * 0.3, 4, 2); ctx.fill();
    const cx = paddle.x, cy = y + h / 2 + 1;
    ctx.fillStyle = 'rgba(255,90,140,.5)';
    ctx.beginPath(); ctx.ellipse(cx - 17, cy + 3, 4, 2.5, 0, 0, 7); ctx.ellipse(cx + 17, cy + 3, 4, 2.5, 0, 0, 7); ctx.fill();
    drawFaceEyes(cx, cy - 1, sq > 0.3 || paddle.happy > 0 ? 'happy' : 'normal', 0.9);
    ctx.beginPath(); ctx.moveTo(cx - 3.5, cy + 3); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx + 3.5, cy + 3);
    ctx.lineWidth = 1.6; ctx.stroke();
  }

  function drawBalls() {
    for (const b of balls) {
      b.trail.forEach((t, i) => {
        ctx.fillStyle = `rgba(255,200,90,${(i + 1) / b.trail.length * 0.3})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (0.4 + i / b.trail.length * 0.5), 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#f3b400'; ctx.beginPath(); ctx.arc(b.x, b.y + 1.5, b.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffdc4a'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(b.x - 3.5, b.y - 4, 2.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#5a3a4a';
      ctx.beginPath(); ctx.arc(b.x - 3.5, b.y, 1.5, 0, 7); ctx.arc(b.x + 3.5, b.y, 1.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff9a3c';
      ctx.beginPath(); ctx.moveTo(b.x - 2, b.y + 2.5); ctx.lineTo(b.x + 2, b.y + 2.5); ctx.lineTo(b.x, b.y + 5); ctx.closePath(); ctx.fill();
    }
  }

  function drawPowerups() {
    for (const p of powerups) {
      const s = 1 + Math.sin(p.t * 8) * 0.08;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 16 * s, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffc2da'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = `${20 * s}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.icon, p.x, p.y + 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      if (p.kind === 'heart') { heartPath(p.x, p.y, p.size); ctx.fill(); }
      else if (p.kind === 'star') { starPath(p.x, p.y, p.size * 0.8, p.rot); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t / 0.9;
      text(p.text, p.x, p.y, 18, p.color);
    }
    ctx.globalAlpha = 1;
  }

  function card(title, lines, hint, titleColor = '#ff6fa5') {
    ctx.fillStyle = 'rgba(255,245,250,.6)'; ctx.fillRect(0, HUD, W, H - HUD);
    const cw = 360, chh = 120 + lines.length * 34, cx = (W - cw) / 2, cy = H / 2 - chh / 2 - 30;
    rr(cx, cy + 6, cw, chh, 28); ctx.fillStyle = '#ffd1e3'; ctx.fill();
    rr(cx, cy, cw, chh, 28); ctx.fillStyle = '#fff'; ctx.fill();
    text(title, W / 2, cy + 50, 38, titleColor);
    lines.forEach((l, i) => text(l, W / 2, cy + 100 + i * 34, 21, '#7a5a6c', 'center', null));
    if (hint) {
      const a = 0.55 + Math.sin(time * 5) * 0.45;
      ctx.globalAlpha = a;
      text(hint, W / 2, cy + chh + 40, 22, '#8a7bd6');
      ctx.globalAlpha = 1;
    }
  }

  function drawOverlay() {
    const tap = matchMedia('(pointer: coarse)').matches ? '화면을 탭' : '클릭 또는 스페이스';
    if (state === 'title') {
      card('말랑 벽돌깨기', ['말랑말랑 친구들을 톡톡 깨보자!', '🍓 길어지기  ⭐ 분신술', '🐢 느려지기  💖 목숨 추가', `최고 점수 ${best}`], `${tap}로 시작!`);
    } else if (state === 'pause') {
      card('잠깐 쉬는 중', ['숨 고르고 다시 가자~'], `${tap}로 계속`, '#8a7bd6');
    } else if (state === 'clear') {
      card('스테이지 클리어!', [`보너스 +${100 + lives * 20}`, `점수 ${score}`], `${tap}로 다음 스테이지`, '#ff8a3d');
    } else if (state === 'over') {
      card('게임 오버', [`점수 ${score}`, newBest ? '🎉 최고 기록 달성! 🎉' : `최고 점수 ${best}`, `STAGE ${level + 1}까지 왔어요`], `${tap}로 다시 하기`, '#8a7bd6');
    } else if (state === 'play' && balls.some(b => b.stuck)) {
      const a = 0.5 + Math.sin(time * 5) * 0.5;
      ctx.globalAlpha = a;
      text(matchMedia('(pointer: coarse)').matches ? '탭해서 발사!' : '클릭 / 스페이스로 발사!', W / 2, paddle.y - 60, 22, '#ff6fa5');
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    drawBricks();
    drawPowerups();
    drawPaddle();
    drawBalls();
    drawParticles();
    ctx.restore();
    drawHud();
    if (state === 'play') {
      let bx = 14;
      if (wideT > 0) { text(`🍓 ${Math.ceil(wideT)}`, bx, H - 22, 18, '#ff6fa5', 'left'); bx += 70; }
      if (slowT > 0) { text(`🐢 ${Math.ceil(slowT)}`, bx, H - 22, 18, '#5cbf7e', 'left'); }
    }
    drawOverlay();
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
